[project]
name = "hermes-rpt"
version = "0.1.0"
description = "Hermes-RPT: secure, multi-tenant relational ML platform for Hermes VMS fleet and logistics data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hermes-RPT contributors" }]

dependencies = [
  "fastapi>=0.140,<0.141",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<0.32",
  "uvicorn[standard]>=0.51,<0.52",
  "structlog>=26.1,<27",
  "prometheus-client>=0.24,<0.25",
  "pyjwt[crypto]>=2.13,<3",
  "python-multipart>=0.0.32,<0.1",
  "httpx>=0.28,<0.29",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
  "aiosqlite>=0.20,<0.21",
  "types-pyyaml>=6.0,<7",
]
# Heavy ML dependencies are kept in a separate group so `uv sync` (Phase 1
# smoke tests, CI for non-model phases) stays fast. Install with
# `uv sync --group ml` starting at Phase 10 (baseline models).
ml = [
  "torch>=2.13,<3",
  "mlflow>=3.14,<4",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_rpt", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
packages = ["hermes_rpt"]
mypy_path = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apps.*"
disallow_untyped_defs = false

# Heavy ML libraries (Phase 10+, `ml` dependency group) either ship no type stubs at all
# (mlflow) or stubs too incomplete to satisfy strict mode (sklearn, torch) — ignored here rather
# than per-import, consistent with how this project treats any third-party dependency with no
# usable stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "mlflow.*", "torch.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
