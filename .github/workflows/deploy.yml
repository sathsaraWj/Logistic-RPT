name: Deploy to Cloud Run

# Builds apps/api's container image, pushes it to Artifact Registry, deploys it to Cloud Run, and
# applies any pending Alembic migrations against the control-plane Cloud SQL instance — see
# docs/DEPLOYMENT.md for the one-time GCP bootstrap this depends on (project, Cloud SQL,
# Artifact Registry, service accounts, Workload Identity Federation — all already created;
# nothing here creates infrastructure).
#
# Authenticates to GCP via Workload Identity Federation (no long-lived service account key is
# stored in this repository) — see docs/DEPLOYMENT.md's WIF section for exactly how
# `github-deployer@hermes-rpt-demo.iam.gserviceaccount.com` is scoped to only this repository.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "migrations/**"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: hermes-rpt-demo
  REGION: us-central1
  REPOSITORY: hermes-rpt
  SERVICE: hermes-rpt-api
  CLOUDSQL_INSTANCE: "hermes-rpt-demo:us-central1:hermes-rpt-control-db"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.2"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --group ml is required too: apps.api.main imports hermes_rpt.inference.model_loading
        # unconditionally, which imports mlflow/torch at module level, so even collecting
        # tests/unit/test_health.py (which imports create_app) fails without it.
        run: uv sync --group dev --group ml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src/hermes_rpt

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Security tests (tenant isolation, auth, injection, artifact/RLS hardening)
        run: uv run pytest tests/security -v

      - name: Security static analysis
        run: uv run bandit -c pyproject.toml -r src apps

      - name: Dependency vulnerability scan
        run: uv run pip-audit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.2"

      - name: Install Python 3.12
        run: uv python install 3.12

      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/341508818275/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@hermes-rpt-demo.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image via Cloud Build
        # Built on Cloud Build, not the runner's local Docker daemon: this image's ml dependency
        # group (torch + CUDA wheels) needs more disk than GitHub's standard runners have free
        # (~14GB), which was silently failing this step on every deploy. Cloud Build's default
        # machine has generous disk headroom (bumped further in docker/cloudbuild.yaml).
        run: |
          gcloud builds submit \
            --config=docker/cloudbuild.yaml \
            --substitutions=_IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api,_TAG=${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} \
            .

      - name: Render Cloud Run service manifest
        run: |
          sed "s|IMAGE_TAG_PLACEHOLDER|${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}|" \
            docker/cloudrun-service.yaml > /tmp/cloudrun-service.rendered.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace /tmp/cloudrun-service.rendered.yaml \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Run database migrations
        run: |
          curl -sL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port=15432 "${{ env.CLOUDSQL_INSTANCE }}" &
          PROXY_PID=$!
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null && break
            sleep 1
          done
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=hermes-rpt-db-password --project=${{ env.PROJECT_ID }})"
          export DATABASE_URL="postgresql+asyncpg://hermes:${DB_PASSWORD}@127.0.0.1:15432/hermes_control"
          uv sync
          uv run alembic upgrade head
          kill $PROXY_PID

      - name: Verify deployment
        run: |
          URL="$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)')"
          curl -sf "$URL/health/ready" || (echo "Deployed service failed its own readiness check" && exit 1)
          echo "Deployed: $URL"
