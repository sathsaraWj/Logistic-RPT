name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.2"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --group ml is required too: apps.api.main imports hermes_rpt.inference.model_loading
        # unconditionally, which imports mlflow/torch at module level, so even collecting
        # tests/unit/test_health.py (which imports create_app) fails without it.
        run: uv sync --group dev --group ml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src/hermes_rpt

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Security tests (tenant isolation, auth, injection, artifact/RLS hardening)
        run: uv run pytest tests/security -v

      - name: Documentation check
        run: uv run python scripts/check_docs.py

      - name: Security static analysis
        run: uv run bandit -c pyproject.toml -r src apps

      - name: Dependency vulnerability scan
        run: uv run pip-audit # blocking as of Phase 16 — current baseline is clean

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
